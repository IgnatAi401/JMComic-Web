<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/logo-64.png" />
    <title>订阅与追更 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="subscriptions" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page subscriptions-page">
        <header class="page-head is-compact"><h1 class="page-title">订阅与追更</h1></header>
        <nav class="view-tabs subscription-tabs" aria-label="订阅与追更视图"><button type="button" data-view="authors" aria-pressed="true">作者新作</button><button type="button" data-view="tracking" aria-pressed="false">追踪连载</button></nav>
        <div class="list-toolbar">
            <select class="select toolbar-select subscription-filter" aria-label="按作者筛选" hidden></select>
            <span class="toolbar-status subscription-status" role="status">读取中…</span>
            <div class="toolbar-actions"><button class="icon-btn" type="button" data-check-updates aria-label="检查作者新作" title="检查作者新作"></button></div>
        </div>
        <div class="comic-grid subscription-grid"></div>
    </div></main>
    <script type="module" src="./src/pages/subscriptions.js"></script>
</body>
</html>

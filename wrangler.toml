# jm.ignat.ai on Cloudflare Workers: static assets only, no Worker script.
# The workflow copies the site files into _site before `wrangler deploy`.
# The custom domain jm.ignat.ai is already bound in the Cloudflare dashboard,
# so no routes here: deploys only upload a new version and leave it alone.
name = "jmcomic-web"
compatibility_date = "2026-09-25"
# Only the custom domain: no workers.dev or preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./_site"

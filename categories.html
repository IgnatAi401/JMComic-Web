<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <link rel="apple-touch-icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>分类浏览 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/listing.css" />
</head>
<body data-page="categories">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1">
        <div class="page listing">
            <header class="page-head">
                <div class="page-head-copy">
                    <span class="eyebrow">分类与排行</span>
                    <h1 class="page-title">分类浏览</h1>
                    <p class="page-lede">按分类、时间周期和热度组合筛选，结果会随条件即时刷新。</p>
                </div>
            </header>
            <div class="listing-layout">
                <div class="listing-bar">
                    <p class="listing-state" data-result-state aria-live="polite">正在载入</p>
                    <div class="listing-bar-actions">
                        <button class="btn btn-outline btn-sm filter-toggle" type="button" data-filter-toggle aria-haspopup="dialog">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
                            筛选 <b class="badge" data-filter-count hidden>0</b>
                        </button>
                        <button class="btn btn-ghost btn-sm" type="button" data-filter-reset disabled>重置筛选</button>
                    </div>
                </div>
                <aside class="filter-panel" aria-label="筛选条件"></aside>
                <div class="listing-results">
                    <div class="comic-grid" data-results></div>
                    <div class="feed-footer" data-feed></div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="./src/pages/categories.js"></script>
</body>
</html>

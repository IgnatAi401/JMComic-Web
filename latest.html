<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <link rel="apple-touch-icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>最新更新 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/listing.css" />
</head>
<body data-page="latest">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1">
        <div class="page listing">
            <header class="page-head">
                <div class="page-head-copy">
                    <span class="eyebrow">持续更新</span>
                    <h1 class="page-title">最新更新</h1>
                    <p class="page-lede">按上架时间排列的新作与更新，向下滚动自动加载。</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-outline btn-sm" type="button" data-refresh>
                        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.7-4.4L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.7 4.4L20 16"/><path d="M20 20v-4h-4"/></svg>
                        刷新
                    </button>
                </div>
            </header>
            <div class="comic-grid" data-results></div>
            <div class="feed-footer" data-feed></div>
        </div>
    </main>
    <script type="module" src="./src/pages/latest.js"></script>
</body>
</html>

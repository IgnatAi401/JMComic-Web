<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>设置 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="setting" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page setting-page">
        <header class="page-head"><div class="page-head-copy"><h1 class="page-title">设置</h1></div></header>
        <div class="settings-stack">
            <section class="settings-section" aria-labelledby="settings-account-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-account-title">JM 账号</h2></div>
                <div class="group">
                <button class="group-row" type="button" data-open-account><span class="settings-icon" data-tone="accent"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.9-3.9 3.6-6 7.5-6s6.6 2.1 7.5 6"/></svg></span><span class="group-row-copy"><strong data-account-name>未登录</strong><small data-account-hint>点此登录</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <button class="group-row" type="button" data-checkin><span class="settings-icon" data-tone="success"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="m9 15 2 2 4-4"/></svg></span><span class="group-row-copy"><strong data-checkin-label>每日签到</strong><small data-checkin-state>登录后可签到</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <label class="group-row switch settings-switch-row"><span class="settings-icon" data-tone="info"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></span><span class="group-row-copy"><strong>每日自动签到</strong><small>每天第一次打开网站时自动签到</small></span><input type="checkbox" data-auto-checkin aria-label="每日自动签到" /></label>
                </div>
            </section>
            <section class="settings-section" aria-labelledby="settings-reading-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-reading-title">阅读体验</h2></div>
                <div class="group settings-reading" id="settings-reading"></div>
            </section>
            <section class="settings-section" aria-labelledby="settings-tag-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-tag-title">标签偏好</h2></div>
                <div class="group preference-card" id="settings-tag-preferences"></div>
            </section>
            <section class="settings-section" aria-labelledby="settings-author-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-author-title">作者偏好</h2></div>
                <div class="group preference-card" id="settings-author-preferences"></div>
            </section>
            <section class="settings-section" aria-labelledby="settings-data-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-data-title">浏览器数据</h2></div>
                <div class="group">
                <button class="group-row" type="button" data-clear-cache><span class="settings-icon" data-tone="info"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></svg></span><span class="group-row-copy"><strong>清除接口缓存</strong><small data-cache-hint>不影响历史和书架</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <button class="group-row" type="button" data-export-data><span class="settings-icon" data-tone="accent"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg></span><span class="group-row-copy"><strong>导出用户数据</strong><small>下载 JSON 备份</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <button class="group-row" type="button" data-import-data><span class="settings-icon" data-tone="warning"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 19.5h14"/></svg></span><span class="group-row-copy"><strong>导入用户数据</strong><small>会覆盖当前数据</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <input class="visually-hidden" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true" data-import-file />
                <a class="group-row" href="./library.html" data-navigation-scope="same-tab"><span class="settings-icon" data-tone="success"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h4v15H5zM10 4.5h4v15h-4z"/><path d="m15.2 5.2 3.8-1 3 14.6-3.8 1z"/></svg></span><span class="group-row-copy"><strong>书架</strong></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>
                </div>
            </section>
            <section class="settings-section" aria-labelledby="settings-about-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-about-title">关于项目</h2></div>
                <div class="group">
                <button class="group-row" type="button" data-open-changelog><span class="settings-icon" data-tone="info"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="17.5" r="1"/></svg></span><span class="group-row-copy"><strong>更新日志</strong><small data-changelog-version>查看每次更新的内容</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <a class="group-row" href="https://github.com/IgnatAi401/JMComic-Web" target="_blank" rel="noopener noreferrer"><span class="settings-icon" data-tone="warning"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></span><span class="group-row-copy"><strong>GitHub · IgnatAi401/JMComic-Web</strong><small>觉得好用欢迎点个 Star ⭐</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></a>
                </div>
            </section>
        </div>
    </div></main>
    <script type="module" src="./src/pages/setting.js"></script>
</body>
</html>

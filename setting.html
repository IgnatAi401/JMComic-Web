<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>设置 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="setting" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page setting-page">
        <header class="page-head"><div class="page-head-copy"><span class="eyebrow">按你的习惯</span><h1 class="page-title">设置</h1><p class="page-lede">纯静态版本：阅读设置、历史与缓存都只保存在当前浏览器。</p></div></header>
        <div class="settings-stack">
            <section class="settings-section" aria-labelledby="settings-reading-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-reading-title">阅读体验</h2><p class="settings-section-note">仅保存在此设备</p></div>
                <div class="group settings-reading" id="settings-reading"></div>
            </section>
            <section class="settings-section" aria-labelledby="settings-data-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-data-title">浏览器数据</h2><p class="settings-section-note">全部保存在当前浏览器</p></div>
                <div class="group">
                <button class="group-row" type="button" data-clear-cache><span class="settings-icon" data-tone="info"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></svg></span><span class="group-row-copy"><strong>清除接口缓存</strong><small data-cache-hint>作品资料、分类与首页推荐的缓存；不影响历史和书架</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
                <a class="group-row" href="./library.html" data-navigation-scope="same-tab"><span class="settings-icon" data-tone="success"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h4v15H5zM10 4.5h4v15h-4z"/><path d="m15.2 5.2 3.8-1 3 14.6-3.8 1z"/></svg></span><span class="group-row-copy"><strong>书架</strong><small>最近阅读、随机发现与稍后再看</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>
                </div>
            </section>
            <section class="settings-section" aria-labelledby="settings-about-title">
                <div class="settings-section-head"><h2 class="settings-section-title" id="settings-about-title">关于项目</h2><p class="settings-section-note">开源免费</p></div>
                <div class="group">
                <a class="group-row" href="https://github.com/IgnatAi401/JMComic-Web" target="_blank" rel="noopener noreferrer"><span class="settings-icon" data-tone="warning"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></span><span class="group-row-copy"><strong>GitHub · IgnatAi401/JMComic-Web</strong><small>觉得好用的话，欢迎到 GitHub 点个 Star ⭐ 支持一下，你的鼓励是我更新的动力！</small></span><svg class="chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h5.5V10"/><path d="M19.5 4.5 11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></a>
                </div>
            </section>
        </div>
    </div></main>
    <script type="module" src="./src/pages/setting.js"></script>
</body>
</html>

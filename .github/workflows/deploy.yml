name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect site files
        run: |
          mkdir _site
          cp -R *.html robots.txt favicon.ico apple-touch-icon.png image _headers _site/
          # JS/CSS go under a content-hash folder so browsers can cache them forever;
          # relative imports inside the modules inherit the prefix automatically.
          version=$(find src style -type f | sort | xargs sha256sum | sha256sum | cut -c1-10)
          mkdir -p "_site/v/$version"
          cp -R src style "_site/v/$version/"
          sed -i -E "s#(src|href)=\"\./(src|style)/#\1=\"./v/$version/\2/#g" _site/*.html
          echo "Asset version: $version"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Static assets only (see wrangler.toml). Only this step sees the token.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./image/logo-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>社区推荐 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/listing.css" />
</head>
<body data-page="recommend">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1">
        <div class="page listing recommend-page">
            <header class="page-head is-compact"><h1 class="page-title">社区推荐</h1></header>
            <nav class="view-tabs" aria-label="排序"><button type="button" data-sort="hot">热门</button><button type="button" data-sort="new">最新</button><button type="button" data-sort="top">最多推荐</button></nav>
            <div class="list-toolbar">
                <span class="toolbar-status" data-result-state role="status">读取中…</span>
                <div class="toolbar-actions"><button class="icon-btn" type="button" data-refresh aria-label="刷新" title="刷新"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.7-4.4L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.7 4.4L20 16"/><path d="M20 20v-4h-4"/></svg></button></div>
            </div>
            <div class="comic-grid" data-results></div>
            <div class="feed-footer" data-feed></div>
        </div>
    </main>
    <script type="module" src="./src/pages/recommend.js"></script>
</body>
</html>
